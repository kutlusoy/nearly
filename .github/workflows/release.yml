name: Release

# With the repository secrets NEARLY_KEYSTORE_BASE64, NEARLY_KEYSTORE_PASSWORD and NEARLY_KEY_ALIAS the release is built and signed with the release key.
# Without them the workflow builds a test release signed with the public test key and marks it as a pre-release.
# If only some of the secrets are set, the workflow stops, because that is a mistake.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v, must match app/version.txt (for example 0.0.1)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  helpers:
    uses: ./.github/workflows/helpers.yml

  release:
    name: Build and publish release
    needs: helpers
    # Runs also when the helper build failed: a test release does not need Tor and I2P yet, a signed release does
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then wanted=$GITHUB_REF_NAME; else wanted=$INPUT_VERSION; fi
          python3 -I tools/version.py --selftest
          python3 -I tools/version.py "$wanted" > "$RUNNER_TEMP/version.out"
          cat "$RUNNER_TEMP/version.out"
          awk -F= '{ print toupper($1) "=" $2 }' "$RUNNER_TEMP/version.out" >> "$GITHUB_ENV"

      - name: Check for the release key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.NEARLY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEARLY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEARLY_KEY_ALIAS }}
        run: |
          set=0
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS"; do [[ -n $value ]] && set=$((set + 1)); done
          if [[ $set == 3 ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "The release key is set, building the signed release."
          elif [[ $set == 0 ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release key secrets found. Building a TEST release signed with the public test key, see doc/guideline-release-signing.md."
          else
            echo "::error::Only some of NEARLY_KEYSTORE_BASE64, NEARLY_KEYSTORE_PASSWORD and NEARLY_KEY_ALIAS are set. Set all three or none."
            exit 1
          fi

      - name: Download the Tor and I2P helpers
        if: ${{ needs.helpers.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: helpers
          path: app/src/main

      - name: Check the Tor and I2P helpers
        env:
          HELPERS_RESULT: ${{ needs.helpers.result }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          if [[ $HELPERS_RESULT != success ]]; then
            if [[ $SIGNED == true ]]; then
              echo "::error::The helper build did not succeed ($HELPERS_RESULT). A signed release must contain Tor and I2P."
              exit 1
            fi
            echo "::warning::The helper build did not succeed ($HELPERS_RESULT). The test release is built without Tor and I2P."
            exit 0
          fi
          for abi in arm64-v8a x86_64; do
            manifest=app/src/main/assets/network-manifest/helpers-$abi.env
            [[ -f $manifest ]] || { echo "::error::$manifest is missing"; exit 1; }
            source "$manifest"
            [[ $(sha256sum app/src/main/jniLibs/$abi/libtor.so | cut -d' ' -f1) == "$TOR_LIB_SHA256" ]] || { echo "::error::libtor.so for $abi does not match its manifest"; exit 1; }
            [[ $(sha256sum app/src/main/jniLibs/$abi/libi2pd.so | cut -d' ' -f1) == "$I2PD_LIB_SHA256" ]] || { echo "::error::libi2pd.so for $abi does not match its manifest"; exit 1; }
            echo "$abi: tor $TOR_TAG, i2pd $I2PD_TAG"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      # Signed release

      - name: Prepare signing
        if: ${{ steps.key.outputs.signed == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.NEARLY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEARLY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEARLY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEARLY_KEY_PASSWORD }}
        run: |
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > app/signing/release.properties

      - name: Build signed release APK and bundle
        if: ${{ steps.key.outputs.signed == 'true' }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect files
        if: ${{ steps.key.outputs.signed == 'true' }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Nearly-$VERSION.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/Nearly-$VERSION.aab"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "dist/Nearly-$VERSION-mapping.txt"
          fi
          (cd dist && sha256sum ./*.apk ./*.aab > SHA256SUMS.txt)

      - name: Check the APK
        if: ${{ steps.key.outputs.signed == 'true' }}
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.NEARLY_RELEASE_CERT_SHA256 }}
        run: |
          bash tools/release-notes.sh facts "dist/Nearly-$VERSION.apk" | tee "$RUNNER_TEMP/facts.out"
          source "$RUNNER_TEMP/facts.out"
          fail() { echo "::error::$1"; exit 1; }
          [[ $PACKAGE_NAME == com.kutlusoy.nearly ]] || fail "Unexpected application ID $PACKAGE_NAME"
          [[ $APK_VERSION_NAME == "$VERSION" ]] || fail "The APK says version $APK_VERSION_NAME but the release is $VERSION"
          [[ $APK_VERSION_CODE == "$VERSION_CODE" ]] || fail "The APK has version code $APK_VERSION_CODE but tools/version.py says $VERSION_CODE"
          [[ -n $CERT_SHA256 ]] || fail "No signing certificate found in the APK"
          if [[ -n $EXPECTED_CERT_SHA256 && $CERT_SHA256 != "$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')" ]]; then
            fail "The APK certificate $CERT_SHA256 does not match NEARLY_RELEASE_CERT_SHA256"
          fi

      - name: Check the proof for the Android developer verification
        if: ${{ steps.key.outputs.signed == 'true' }}
        run: |
          file=app/src/main/assets/adi-registration.properties
          if [[ ! -f $file ]]; then
            echo "::warning::$file is missing. The release cannot be used as proof of ownership for the Android developer verification, see doc/guideline-google-play.md."
          elif [[ $(tr -d '[:space:]' < $file | wc -c) -lt 8 || $(wc -c < $file) -gt 2000 ]]; then
            echo "::error::$file does not look like the snippet of the console."
            exit 1
          fi
          source <(bash tools/release-notes.sh facts "dist/Nearly-$VERSION.apk")
          if [[ -f $file && $ADI_FILE != yes ]]; then
            echo "::error::$file exists but is not part of the APK"
            exit 1
          fi

      - name: Release notes
        if: ${{ steps.key.outputs.signed == 'true' }}
        run: bash tools/release-notes.sh notes "dist/Nearly-$VERSION.apk" "dist/Nearly-$VERSION.aab" "$VERSION" "$GITHUB_SHA" > dist/NOTES.md

      # Test release

      - name: Prepare the public test key
        if: ${{ steps.key.outputs.signed != 'true' }}
        run: |
          if [[ ! -f app/debug.keystore ]]; then base64 -d app/debug.keystore.b64 > app/debug.keystore; fi

      - name: Build the test APK
        if: ${{ steps.key.outputs.signed != 'true' }}
        run: gradle assembleDebug -PtestBuild=${{ github.run_number }} --stacktrace

      - name: Collect test files
        if: ${{ steps.key.outputs.signed != 'true' }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/Nearly-$VERSION-test.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          short=${GITHUB_SHA::7}
          {
            echo "TEST build of version $VERSION from commit $short."
            echo
            echo "Signed with the public test key of the repository, NOT with the release key. For testing only, not for the store."
            echo "Application ID: com.kutlusoy.nearly.debug, so it installs next to a real release."
            if [[ -f app/src/main/jniLibs/arm64-v8a/libtor.so ]]; then echo "Contains Tor and I2P."; else echo "Built without Tor and I2P."; fi
          } > dist/NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create or update the signed release
        if: ${{ steps.key.outputs.signed == 'true' }}
        run: |
          flags=()
          if [[ $PRERELEASE == true ]]; then flags+=(--prerelease); else flags+=(--prerelease=false); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A test build of the same version is replaced by the signed one
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -- '-test' || true); do
              gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release upload "$TAG" dist/*.apk dist/*.aab dist/*.txt --clobber
            gh release edit "$TAG" --title "Nearly v$VERSION" --notes-file dist/NOTES.md "${flags[@]}"
          else
            gh release create "$TAG" dist/*.apk dist/*.aab dist/*.txt \
              --target "$GITHUB_SHA" --title "Nearly v$VERSION" --notes-file dist/NOTES.md "${flags[@]}"
          fi

      - name: Create or update the test release
        if: ${{ steps.key.outputs.signed != 'true' }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/*.txt --clobber
            gh release edit "$TAG" --title "Nearly v$VERSION (test build)" --notes-file dist/NOTES.md --prerelease
          else
            gh release create "$TAG" dist/*.apk dist/*.txt \
              --target "$GITHUB_SHA" --title "Nearly v$VERSION (test build)" --notes-file dist/NOTES.md --prerelease
          fi
