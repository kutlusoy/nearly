name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The public test key keeps the signature of the debug APK the same from build to build, so a new APK installs over the old one
      - name: Prepare the public test key
        run: |
          if [[ ! -f app/debug.keystore ]]; then base64 -d app/debug.keystore.b64 > app/debug.keystore; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Check the version file
        run: |
          python3 -I tools/version.py --selftest
          python3 -I tools/version.py

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle lintDebug --stacktrace
        continue-on-error: true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Release build
        run: gradle assembleRelease --stacktrace

      - name: Check the version code of the APK
        run: |
          expected=$(python3 -I tools/version.py | sed -n 's/^version_code=//p')
          actual=$(bash tools/release-notes.sh facts app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^APK_VERSION_CODE=//p')
          echo "expected $expected, APK has $actual"
          [[ $expected == "$actual" ]]

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nearly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
